spring.application.name=recruitment-system
server.port=8080

# ---------- MySQL (default) ----------
# Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD, or edit the defaults below.
# The database is created automatically on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruitment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No MySQL? Run with the "h2" profile instead (see application-h2.properties):
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.frontend-url=http://localhost:5173
